repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: 🎨 black (formatage)
        args:
          - --line-length=120

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: 🔀 isort (imports)
        args:
          - --profile=black
          - --line-length=120

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        name: 🧪 flake8 (analyse statique)
        args:
          - --max-line-length=120

   # 🔒 pre-commit-hooks — sécurité et hygiène de dépôt
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
